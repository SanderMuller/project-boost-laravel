name: ci-smoke

permissions:
  contents: read

on:
  push:
    paths:
      - '**.php'
      - 'composer.json'
      - 'resources/boost/**'
      - '.github/workflows/ci-smoke.yml'
  pull_request:
    paths:
      - '**.php'
      - 'composer.json'
      - 'resources/boost/**'
      - '.github/workflows/ci-smoke.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Fresh-install sync smoke

    steps:
      - name: Checkout companion
        uses: actions/checkout@v6
        with:
          path: companion

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Create fresh Laravel app
        run: composer create-project laravel/laravel skeleton --no-interaction --prefer-dist

      - name: Install companion from checkout into the app
        working-directory: skeleton
        run: |
          composer config repositories.companion '{"type":"path","url":"../companion","options":{"symlink":false}}'
          composer config minimum-stability dev
          composer config prefer-stable true
          composer require --dev "sandermuller/project-boost-laravel:*@dev" --no-interaction

      - name: Write minimal boost.php
        working-directory: skeleton
        run: |
          cat > boost.php <<'PHP'
          <?php declare(strict_types=1);

          use SanderMuller\BoostCore\Config\BoostConfig;
          use SanderMuller\BoostCore\Enums\Agent;

          return BoostConfig::configure()->withAgents([Agent::CLAUDE_CODE]);
          PHP

      - name: Run project-boost:install (non-interactive — exercises the McpWriter-per-agent path)
        working-directory: skeleton
        # Explicit --no-interaction defensively; the wrapper also auto-detects
        # via stream_isatty(STDIN), but the explicit flag is a belt-and-
        # suspenders signal for CI clarity.
        run: php artisan project-boost:install --no-sync --no-interaction

      - name: Assert MCP config landed on disk
        working-directory: skeleton
        run: |
          set -e
          if [ ! -f .mcp.json ]; then
            echo "FAIL: .mcp.json was not written by project-boost:install"
            exit 1
          fi
          if ! grep -q 'laravel-boost' .mcp.json; then
            echo "FAIL: .mcp.json does not contain the laravel-boost MCP server entry"
            cat .mcp.json
            exit 1
          fi
          echo "PASS: .mcp.json present and contains laravel-boost server entry"

      - name: Run project-boost:sync
        working-directory: skeleton
        run: php artisan project-boost:sync

      - name: Assert no Blade directives leaked into generated output
        working-directory: skeleton
        run: |
          set -e
          fail=0

          # Bare @php opening directives (Blade-render didn't fire on a `.blade.php` skill).
          # Line-anchored so legitimate prose mentions like "@php artisan ..." don't false-positive.
          if grep -RnE '^@php$|^@php[[:space:]]*$' CLAUDE.md .claude/skills/ 2>/dev/null; then
            echo "FAIL: bare @php Blade directive leaked into generated output"
            fail=1
          fi

          # @boostsnippet / @endboostsnippet should be expanded, never literal.
          if grep -RnE '^@boostsnippet|^@endboostsnippet' CLAUDE.md .claude/skills/ 2>/dev/null; then
            echo "FAIL: literal @boostsnippet directive leaked into generated output"
            fail=1
          fi

          # Note: NO check for `{{ $var }}` patterns. Blade's `@{{ ... }}`
          # escape syntax intentionally renders to literal `{{ ... }}` so
          # downstream tools (Livewire wire:* attrs, JS template engines)
          # can consume mustaches the post-render markdown legitimately
          # contains. A grep can't disambiguate that from a real leak.
          # The two checks above are reliable: if Blade didn't render,
          # `@php` and `@boostsnippet` would leak verbatim.

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "PASS: no Blade directives leaked into rendered output"

      - name: Show generated file inventory (debug aid on failure)
        if: always()
        working-directory: skeleton
        run: |
          echo "--- CLAUDE.md (first 40 lines) ---"
          head -40 CLAUDE.md || true
          echo "--- .claude/skills/ tree ---"
          find .claude/skills -type f 2>/dev/null | head -20 || true
